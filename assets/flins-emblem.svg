<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="菲林斯 · 誓灯">
  <title>菲林斯 · 誓灯</title>
  <defs>
    <linearGradient id="flinsTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3480"/>
      <stop offset="1" stop-color="#0B0F2B"/>
    </linearGradient>
    <linearGradient id="flinsFlame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAFBFF"/>
      <stop offset="0.5" stop-color="#60E0F0"/>
      <stop offset="1" stop-color="#4C6FE8"/>
    </linearGradient>
    <linearGradient id="flinsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8E080"/>
      <stop offset="1" stop-color="#C89020"/>
    </linearGradient>
    <radialGradient id="flinsHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#60E0F0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#60E0F0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 灯室辉光 -->
  <circle cx="30" cy="26" r="15" fill="url(#flinsHalo)"/>

  <!-- 金色新月（点缀，占比很小；置于右上角，避免与灯顶重叠） -->
  <path d="M52.4 6.4a8.8 8.8 0 1 0 6.3 10.6 7 7 0 1 1-6.3-10.6z" fill="url(#flinsGold)"/>

  <!-- 提灯：顶环 -->
  <path d="M30 8.2a3.4 3.4 0 0 1 3.4 3.4" fill="none" stroke="#B9BCC6"
        stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>

  <!-- 提灯：顶盖 -->
  <path d="M24.2 15.6h11.6l-1.6-4.2H25.8z" fill="#C8CBD6"/>

  <!-- 提灯：灯室（冷蓝火焰） -->
  <rect x="24.6" y="16.2" width="10.8" height="13.4" rx="1.8"
        fill="#0B0F2B" stroke="#C8CBD6" stroke-width="1.3"/>
  <path d="M30 18.4c2.7 3.3 3.9 5.1 3.9 7.1a3.9 3.9 0 0 1-7.8 0c0-2 1.2-3.8 3.9-7.1z"
        fill="url(#flinsFlame)"/>
  <path d="M30 22.4c1.2 1.5 1.7 2.3 1.7 3.3a1.7 1.7 0 0 1-3.4 0c0-1 0.5-1.8 1.7-3.3z"
        fill="#EAFBFF"/>

  <!-- 提灯：塔身（呼应终夜长茔的灯塔） -->
  <path d="M25.6 30.4h8.8l2.4 19.0H23.2z" fill="url(#flinsTower)"/>
  <path d="M23.9 35.0h12.2M24.7 40.4h10.6M25.3 45.8h9.4"
        stroke="#B9BCC6" stroke-width="1.0" opacity="0.45" fill="none" stroke-linecap="round"/>
  <rect x="22.2" y="49.6" width="15.6" height="3.6" rx="1.0" fill="#C8CBD6" opacity="0.85"/>

  <!-- 灯身银饰 -->
  <path d="M30 31.6v17.4" stroke="#F2F4F8" stroke-width="0.8" opacity="0.3"/>
</svg>
